[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yezatas"
version = "0.1.0"
description = "Self-hosted YouTube channel assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tzdata",
    "google-auth",
    "google-auth-oauthlib",
    "google-api-python-client",
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "openai",
    "httpx",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yezatas = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
