[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yezatas"
version = "0.1.0"
description = "Self-hosted YouTube channel assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["tzdata"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
