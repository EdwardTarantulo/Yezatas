<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Yezatas{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body data-poll="{{ '1' if poll|default(false) else '0' }}" data-csrf="{{ csrf|default('') }}">
  <main class="column">
    <header class="masthead">
      <h1>Yezatas</h1>
      <p class="tagline">Your YouTube channel assistant. It runs on your computer.</p>
    </header>
    {% block content %}{% endblock %}
    {% block footer %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
